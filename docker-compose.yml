services:
  panel:
    build: ./panel
    volumes:
      - ./.secrets/panel.json:/data/secrets.json
      - panel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy:/opt/awgpanel/deploy:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./.secrets/caddy.env
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel
    restart: unless-stopped

volumes:
  panel-data:
  caddy-data:
  caddy-config:
