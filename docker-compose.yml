services:
  panel:
    build: ./panel
    environment:
      PANEL_BASE_PATH: "${PANEL_BASE_PATH}"
      AWG_CONTAINER: ${AWG_CONTAINER:-amnezia-awg2}
      AWG_CONFIG_PATH: ${AWG_CONFIG_PATH:-/opt/amnezia/awg/awg0.conf}
      AWG_INTERFACE: ${AWG_INTERFACE:-awg0}
      PUBLIC_ENDPOINT: "${PUBLIC_ENDPOINT}"
      DEFAULT_CLIENT_ALLOWED_IPS: "${DEFAULT_CLIENT_ALLOWED_IPS:-0.0.0.0/0, ::/0}"
      DEFAULT_CLIENT_DNS: "${DEFAULT_CLIENT_DNS}"
    volumes:
      - ./.secrets/panel.json:/data/secrets.json:ro
      - panel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy:/opt/awgpanel/deploy:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN}"
      PANEL_BASE_PATH: "${PANEL_BASE_PATH}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel
    restart: unless-stopped

volumes:
  panel-data:
  caddy-data:
  caddy-config:
