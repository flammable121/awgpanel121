{% extends "base.html" %}
{% block body %}
<div class="layout narrow">
  <header class="topbar">
    <div>
      <div class="brand">Редактирование</div>
      <div class="subtitle">{{ peer.name }}</div>
    </div>
    <a class="btn ghost" href="{{ base_path }}/?tab=clients">Назад</a>
  </header>

  <section class="card">
    <form method="post" class="form">
      <input type="hidden" name="tz_offset" id="tz_offset" value="" />
      <input type="hidden" id="expires_iso" value="{{ expires_iso }}" />
      <label>
        <span>Имя</span>
        <input type="text" name="name" value="{{ peer.name }}" />
      </label>
      <label>
        <span>UUID</span>
        <input type="text" value="{{ peer.id }}" readonly />
      </label>
      <div class="form-row form-row-inline">
        <label>
          <span>Дата</span>
          <input type="date" name="expires_date" value="{{ expires_date }}" />
        </label>
        <label>
          <span>Время</span>
          <input type="time" name="expires_time" value="{{ expires_time }}" />
        </label>
        <label class="toggle">
          <span class="toggle-text">Бессрочно</span>
          <input type="checkbox" name="never_expires" value="1" {% if never_expires %}checked{% endif %} />
          <span class="toggle-track"></span>
        </label>
      </div>
      <label>
        <span>Заметка</span>
        <input type="text" name="note" value="{{ peer.note or '' }}" />
      </label>
      <button class="btn primary" type="submit">Сохранить</button>
    </form>
  </section>
</div>
<script>
  const checkbox = document.querySelector('input[name="never_expires"]');
  const dateInput = document.querySelector('input[name="expires_date"]');
  const timeInput = document.querySelector('input[name="expires_time"]');
  const tzInput = document.querySelector('#tz_offset');
  const isoValue = document.querySelector('#expires_iso')?.value;
  if (tzInput) {
    tzInput.value = String(new Date().getTimezoneOffset());
  }
  if (isoValue && dateInput && timeInput) {
    const utc = new Date(isoValue);
    if (!Number.isNaN(utc.getTime())) {
      const offset = new Date().getTimezoneOffset();
      const local = new Date(utc.getTime() - offset * 60000);
      const pad = (num) => String(num).padStart(2, "0");
      dateInput.value = `${local.getFullYear()}-${pad(local.getMonth() + 1)}-${pad(local.getDate())}`;
      timeInput.value = `${pad(local.getHours())}:${pad(local.getMinutes())}`;
    }
  }
  const sync = () => {
    const disabled = checkbox?.checked;
    if (dateInput) dateInput.disabled = disabled;
    if (timeInput) timeInput.disabled = disabled;
  };
  checkbox?.addEventListener('change', sync);
  sync();
</script>
{% endblock %}
